<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulator Sederhana</title>
    <link rel="stylesheet" href="./style/kalkulator.css">
</head>

<body>
    <div class="calculator-container">
        <h2>Kalkulator</h2>
        <input type="text" name="display" id="display" placeholder="0" readonly>

        <div class="button-grid">
            <button class="btn" onclick="tambahInput('7')">7</button>
            <button class="btn" onclick="tambahInput('8')">8</button>
            <button class="btn" onclick="tambahInput('9')">9</button>
            <button class="btn operator" onclick="tambahInput('+')">+</button>

            <button class="btn" onclick="tambahInput('4')">4</button>
            <button class="btn" onclick="tambahInput('5')">5</button>
            <button class="btn" onclick="tambahInput('6')">6</button>
            <button class="btn operator" onclick="tambahInput('-')">-</button>
            
            <button class="btn" onclick="tambahInput('1')">1</button>
            <button class="btn" onclick="tambahInput('2')">2</button>
            <button class="btn" onclick="tambahInput('3')">3</button>
            <button class="btn operator" onclick="tambahInput('*')">*</button>

            <button class="btn clear" onclick="clearDisplay()">C</button>
            <button class="btn" onclick="tambahInput('0')">0</button>
            <button class="btn equal" onclick="hitung()">=</button>
            <button class="btn operator" onclick="tambahInput('/')">/</button>
        </div>
    </div>

    <script src="./kalkulator.js" ></script>
</body>

</html>
